<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #050b1f 0%, #001233 50%, #002b5c 100%);
            color: #fff;
        }

        /* PANTALLA DE INICIO */
        .inicio {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 1s ease;
        }
        .inicio.oculto { opacity: 0; pointer-events: none; }
        .logo {
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #00bfff;
            margin-bottom: 20px;
        }
        .toca {
            font-size: 20px;
            color: #87ceeb;
            text-shadow: 0 0 10px #fff;
        }

        /* PANTALLA SORPRESA */
        .sorpresa {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }
        .sorpresa.visible { opacity: 1; }
        .titulo {
            font-size: 26px;
            color: #ffd700;
            text-shadow: 0 0 12px #ffd700;
            margin-bottom: 30px;
            text-align: center;
        }
        .ramo {
            text-align: center;
            margin-bottom: 35px;
        }
        .ramo img {
            width: 320px;
            border-radius: 24px;
            box-shadow: 0 0 25px rgba(100,200,255,0.4);
        }
        .carta {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 25px;
            max-width: 360px;
            backdrop-filter: blur(8px);
        }
        .mensaje {
            font-size: 18px;
            line-height: 1.8;
            color: #e0f0ff;
            text-align: center;
        }
        .firma {
            margin-top: 20px;
            font-size: 20px;
            color: #ffd700;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1: INICIO -->
    <div class="inicio" id="inicio" onclick="abrir()">
        <div class="logo">HOT WHEELS</div>
        <p class="toca">💙 Toca para iniciar 💙</p>
    </div>

    <!-- PANTALLA 2: SORPRESA -->
    <div class="sorpresa" id="sorpresa">
        <h1 class="titulo">✨ Un detalle para ti ✨</h1>

        <div class="ramo">
            <img src="https://i.imgur.com/9w8ZFLD.png" alt="Ramo de flores azules con carros Hot Wheels">
        </div>

        <div class="carta">
            <p class="mensaje">
                Porque eres una personita muy especial para mí 💙<br><br>
                Gracias por estar ahí, por todo lo que eres<br>
                y por hacerme tan feliz ✨<br><br>
                Eres increíble y te adoro muchísimo.
            </p>
            <p class="firma">— Para ti, con todo mi cariño 💫</p>
        </div>
    </div>

    <script>
        function abrir() {
            document.getElementById('inicio').classList.add('oculto');
            document.getElementById('sorpresa').classList.add('visible');
        }
    </script>

</body>
</html>
